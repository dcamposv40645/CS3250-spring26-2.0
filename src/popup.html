<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Anonymous Theme Switcher</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <h2>Anonymous Theme Switcher</h2>
        <button id="search-toggle" class="search-toggle-btn" title="Search themes">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <p class="status">Ready to capture themes.</p>

      <div class="search-bar" id="search-panel" style="display: none;">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search themes or groups...">
      </div>

      <h3>Saved Theme Groups</h3>
      <div id="popup-content">
        <p class="status">Loading your Cat Groups...</p>
      </div>

      <hr>
      <button id="shutdown" class="secondary-btn">Exit Extension</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
