<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Anonymous Theme Switcher</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <h2>Anonymous Theme Switcher</h2>
        <button id="add-group-toggle" class="add-group-btn" title="Add theme to group">+</button>
      </div>

      <p class="status">Ready to capture themes.</p>

      <div id="add-group-panel" class="add-group-panel">
        <div class="input-section">
            <input type="text" id="theme-name" placeholder="Theme Name (e.g., Ginger Cat)">
            <input type="text" id="group-name" placeholder="Group Name (e.g., Cats)">
        </div>
        <button id="save-btn">Save To Group</button>
      </div>

      <h3>Saved Themes</h3>
      <div id="popup-content">
        <p class="status">Loading your Cat Groups...</p>
      </div>

      <hr>
      <button id="shutdown" class="secondary-btn">Exit Extension</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
